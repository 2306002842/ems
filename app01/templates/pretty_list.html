{% extends 'layout.html' %}

{% block content %}
    <div style="margin-bottom: 15px;">
        <a class="btn btn-success" href="/pretty/add/">
            <span class="glyphicon glyphicon-plus-sign" aria-hidden="true"></span>
            新建靓号
        </a>
    </div>

    <div class="panel panel-default">
        <div class="panel-body">
            <form method="get" class="form-inline">
                <div class="form-group">
                    <input type="text" name="q" class="form-control" placeholder="搜索号码"
                           value="{{ search_data }}" style="width: 300px;">
                </div>
                <button type="submit" class="btn btn-primary">搜索</button>
            </form>
        </div>
        <div class="panel-heading">
            <span class="glyphicon glyphicon-th-list" aria-hidden="true"></span>
            靓号列表
        </div>
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>号码</th>
                <th>价格</th>
                <th>级别</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            {% for obj in queryset %}
                <tr>
                    <td>{{ obj.mobile }}</td>
                    <td>{{ obj.price }}</td>
                    <td>{{ obj.get_level_display }}</td>
                    <td>{{ obj.get_status_display }}</td>
                    <td>
                        <a class="btn btn-primary btn-xs" href="/pretty/{{ obj.id }}/edit/">编辑</a>
                        <a class="btn btn-danger btn-xs" href="/pretty/{{ obj.id }}/delete/">删除</a>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>

    {# page_string 由分页类生成；搜索词 q 会被自动带进翻页链接 #}
    <div class="clearfix">
        <ul class="pagination">
            {{ page_string }}
        </ul>
    </div>
{% endblock %}
