{% extends 'layout.html' %}

{% block content %}
    <div class="panel panel-default">
        <div class="panel-heading">
            <h3 class="panel-title">新建用户</h3>
        </div>
        <div class="panel-body">
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" class="form-control" placeholder="姓名" name="name"/>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" class="form-control" placeholder="密码" name="password"/>
                </div>
                <div class="form-group">
                    <label>年龄</label>
                    <input type="number" class="form-control" placeholder="年龄" name="age"/>
                </div>
                <div class="form-group">
                    <label>账号</label>
                    <input type="text" class="form-control" placeholder="账号" name="account"/>
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="text" class="form-control" placeholder="手机号" name="phone"/>
                </div>
                <div class="form-group">
                    <label>入职时间</label>
                    <input type="date" class="form-control" name="create_time"/>
                </div>
                <div class="form-group">
                    <label>部门</label>
                    <select class="form-control" name="depart">
                        {% for d in depart_list %}
                            <option value="{{ d.id }}">{{ d.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>性别</label>
                    <select class="form-control" name="gender">
                        {% for k, v in gender_choices %}
                            <option value="{{ k }}">{{ v }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">提 交</button>
            </form>
        </div>
    </div>
{% endblock %}
